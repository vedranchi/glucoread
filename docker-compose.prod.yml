# Production composition for the Oracle VM. Compose it WITH the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The dev-only docker-compose.override.yml is deliberately NOT included here, so
# Postgres is never published to the host on the public VM. Caddy is the only
# container that binds public ports (80/443) and terminates TLS.

# Docker's json driver is unbounded by default; on a free-tier disk that is a
# slow, silent way to run out of space. Anchors do not cross compose files, so
# this block is defined in each.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: glucolog_db
    restart: unless-stopped
    logging: *default_logging

  web:
    # CI builds this and pushes it to GHCR; the VM only pulls (deploy/redeploy.sh).
    # `build:` is kept so the image can still be produced by hand, but a 1 GB
    # free-tier VM should never be the thing doing it — that build takes ~8
    # minutes of IO-starved grinding alongside the live database.
    image: ghcr.io/vedranchi/glucoread:${GLUCOLOG_TAG:-dev}
    build: .
    container_name: glucolog_web
    env_file:
      - .env
      - email.env
    # Wait for Postgres to actually accept connections, not merely to have
    # started. Without this the boot-time `migrate` races the database.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    restart: unless-stopped
    logging: *default_logging

  caddy:
    image: caddy:2
    container_name: glucolog_caddy
    # Caddy retries a cold upstream on its own, so container start is enough
    # here; it does not need to block on web being fully ready.
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      # A DIRECTORY, not the Caddyfile itself. Docker resolves a single-file
      # bind mount to an inode when the container starts, and git replaces a
      # file rather than editing it in place — so after a deploy the container
      # went on serving the pre-merge Caddyfile while the checkout showed the
      # new one. `caddy reload` then validated and applied that stale file and
      # logged success. A directory mount resolves by path on every lookup, so
      # the replacement is seen normally.
      - ./deploy/caddy:/etc/caddy:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default_logging

volumes:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
